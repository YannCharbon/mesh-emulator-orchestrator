# Power profile: EFR32FG25 SoC (MCU and radio on one chip), as our Wi-SUN
# firmware runs it today (nanostack-efr32fg25-freertos: SYSCLK from the 97.5 MHz
# RF PLL, a permanent EM1 requirement). Format: docs/POWER_MODEL.md §6.
# Calibrated with HW5's measurements (POWER_MODEL.md §12); the datasheet-only
# version is efr32fg25-soc-datasheet.ini, kept for comparison.
#
# Units: currents in mA, times in µs, clock in MHz, charges in µC. Every figure
# says where it comes from:
#   [M §x.y]  measured in HW5 on the kits (root repo
#             documents/pre-study/investigation/HW5_BlackBox_Phase1_Results.md,
#             section x.y): BRD4001A AEM, firmware counters, DWT cycle counter
#   [D Tx.y]  EFR32FG25 datasheet Rev. 1.2 (root repo
#             documents/pre-study/datasheets/efr32fg25-datasheet.pdf), table x.y
#   [M3]      measured on the kits in EU PHY mode 3 (2026-10-28, firmware built
#             with FW_PHY_MODE=3): nanostack-efr32fg25-freertos README.md,
#             "Hardware results: idle-tick skipping and PHY mode 3"
#   [V]       checked in our code (file or study named)
#   [I]       inference or estimate
#
# Conditions of the measurements: BRD4271A radio board (EFR32FG25B222F1920IM56)
# on a BRD4001A, AEM supply 3.33 V; Wi-SUN EU, 863.1 MHz + n × 100 kHz,
# 69 channels, PHY mode 1a (2-FSK 50 kbit/s, h = 0.5); TX at +10 dBm; FAN 1.0
# router and border router, radio always on, MCU in EM1 97 % of the time.
#
# PHY mode (POWER_MODEL.md §6.2). A plain key holds the common value; a
# "key@3" line holds the value for nodes whose MAC runs EU mode 3 (2-FSK
# 150 kbit/s, class 2, 35 channels: the emulator's default configs). The
# emulator picks a node's values from the PHY mode its MAC configures;
# wssimserver --power-mode=[IDS:]MODE|common overrides that. The common values
# are EU mode 1a's (the conditions above, the nodes' CONF=eu1a), and any mode
# without its own value takes them. The "@3" values were measured on the same
# kits, +10 dBm, 3.33 V [M3]. Keys without one are the same in both modes; RX
# listening was measured in both and is the same within 0.05 mA.
#
# Chip current = MCU state current + radio state current. HW5 measured the
# chip's total: 8.15 mA with the radio listening and the MCU in EM1, 37.9 mA
# in TX at +10 dBm [M §2.4]. The split between MCU and radio uses the
# datasheet's EM1 (2.145 mA), so the radio figures below are those totals
# minus 2.145.
#
# NOT measured yet (datasheet or estimate, as marked): EM0 and EM1 on their
# own, EM2 and every MCU transition (our FFN firmware never sleeps deeper than
# EM1), the radio's idle and off currents, every radio transition (RAIL
# idle→RX, RX→TX, TX→RX), TX at any level other than +10 dBm, the RX current
# while a frame is being received (taken equal to listening), the CCA on its
# own, cycles of the MAC and "other" timers.

[profile]
name = efr32fg25-soc
kind = soc
supply_v = 3.33             # [M §1] AEM output while measuring (the datasheet's tables are at 3.3 V and 3.6 V)

[mcu]
clock_mhz = 97.5            # [V] SYSCLK = RF PLL (idle-sleep study §4.1)
active_ma = 3.02            # [D T4.5] EM0, 31 µA/MHz × 97.5 MHz, Prime from flash (CoreMark: 43 µA/MHz = 4.19 mA). Not measured alone
sleep_ma = 2.145            # [D T4.5] EM1, 22 µA/MHz × 97.5 MHz. Not measured alone: HW5 measured EM1 + RX = 8.15 mA, see radio.listen_ma
deep_sleep_ma = 0.0046      # [D T4.5] EM2, full RAM retention, RTC on LFXO: 4.6 µA. Not measurable with the FFN firmware (HW8)
sleep_enter_us = 1.13       # [D T4.11] entry to EM1, from flash
sleep_enter_ma = 3.02       # [I] EM0 current during the entry
sleep_wake_us = 0.03        # [D T4.11] wake from EM1: 3 HCLKs at 97.5 MHz
sleep_wake_ma = 3.02        # [I] EM0
deep_enter_us = 5.4         # [D T4.11] entry to EM2, from flash
deep_enter_ma = 3.02        # [I] EM0
deep_wake_us = 213.2        # [D T4.11 + T4.35] wake from EM2 from flash, 12.2 µs, then the HFXO start, 201 µs; PLL lock not in the datasheet
deep_wake_ma = 1.05         # [I] HFXO 0.479 mA [D T4.35] + EM0 on the 19 MHz HFRCO (30 µA/MHz [D T4.5] ≈ 0.57 mA)
# Charge of each wake beyond cycles × (active_ma − sleep_ma). HW5 measured the
# CPU activity above the RX + EM1 floor at 0.5–0.8 µC per wake, 156 wakes/s
# [M §2.4]; the cycles below give 9 730 cycles per mean wake [M §2.5], i.e.
# 99.8 µs × (3.02 − 2.145) mA = 0.087 µC. The rest, 0.65 − 0.087 = 0.56 µC
# (range 0.41–0.71), is charged here: interrupt work the power manager counts
# as EM1, clock start-up, flash wait states [I].
wake_charge_uc = 0.56       # [M §2.4] minus the cycle part [M §2.5, D T4.5]

[cycles]
# Cost model (POWER_MODEL.md §5.1): CPU cycles per kind of work in a wake, at
# mcu.clock_mhz. From the DWT cycle counter, idle router, pooled over 10
# windows [M §2.5]. The firmware's wakes split differently from the
# emulator's causes; each value says how it was mapped.
wake = 4560                 # [M §2.5] a 10 ms tick wake (9 190) minus its handler (4 630): scheduler, run loop, ~3 poll hooks
tick = 4630                 # [M §2.5] tick_timer_eventOS_callback
protocol = 4950             # [M §2.5] protocol_timer_interrupt
mac = 5000                  # [I] MAC timers: not seen in HW5's idle windows; like the other callback timers
fhss = 10200                # [M §2.5] mean of the FHSS port timer (14 900, 5.9/s) and fhss_event_timer_cb (3 170, 3.9/s)
radio = 5830                # [M §2.5] TX-done and CCA_PREPARE callbacks (the driver's timers stand for RAIL events)
other = 5000                # [I] application and other timers: not seen in HW5
event = 3520                # [M §2.5] one event dispatched, idle (4 900 with ping traffic)
frame_in = 0                # [I] a frame on the medium that the radio did not take: no interrupt
rx_frame = 22300            # [M §2.5] frame-received wake 32 700 − wake 4 560 − radio callback 5 830 (no IP payload; with a ping: 60 300 → 49 900)
tx_frame = 67000            # [M §2.5] TX-prepare wake 56 200 + TX-event wake 31 600 − 2 × (wake + radio). RAIL's TX start alone: 43 800
tx_frame@3 = 47200          # [M3] TX-prepare wake 41 900 + TX-event wake 26 100 − 2 × (wake + radio); RAIL's TX start alone: 30 300 (43 900 in mode 1a, same day)

[radio]
off_ma = 0                  # [I] radio powered down: nothing above the MCU state. Not measured (HW8)
idle_ma = 0                 # [I] RAIL idle: the HFXO is already in the MCU's EM1/EM0 figure. Not measured: HW5's radio was never idle
listen_ma = 6.0             # [M §2.4] 8.15 mA (RX listening, MCU in EM1; AEM fit and 10 kHz trace median) − EM1 2.145 [D]. Datasheet: 4.686 (38.4 kbit/s)
                            # mode 3: the same, 6.0, so no "@3" value [M3] (8.12–8.13 mA fit over 20 windows, trace median 8.10, − 2.145; mode 1a the same day 8.07–8.13)
receive_ma = 6.0            # [I] as listening: not measured apart (frames received were 0.2 % of the time)
cca_ma = 6.0                # [I] a CCA is RX
cca_us = 160                # [V] the firmware's CCA in mode 1a (RAIL_PHY_CCA_DURATION_US, 8 symbols at 50 ksym/s; 128 before 2026-10-29, an estimate). HW5 bounds it: TX-state time minus air time is ≤ 0.25 ms per frame, CCA, PA ramp and RAIL's own wait included [M §2.3]
cca_us@3 = 53               # [V] the firmware's CCA in mode 3, 8 symbols at 150 ksym/s (RAIL_PHY_CCA_DURATION_US)
idle_holds_clock = 1        # [I] RAIL time needs the HFXO unless RAIL_ConfigSleep() (study §4.2): an idle radio keeps light sleep
# TX at each power level, dBm:mA, linear in between and clamped outside.
# Measured at +10 dBm only: 37.9 mA chip in TX (CCA and PA ramp included; AEM
# fit, 10 kHz trace plateau 37.4–37.5 mA) − EM1 2.145 = 35.75 [M §2.4].
# The other levels are the datasheet's 915 MHz curve [D T4.8: 0 dBm 24.9 mA,
# 12 dBm 54.5 mA, POUTMAX 15.9 dBm 76.8 mA; each − 1.014 for the MCU in EM1 at
# 39 MHz], scaled by measured / datasheet at +10 dBm = 35.75 / 48.55 = 0.736
# [I]. Check: the datasheet's only 868 MHz point, 14 dBm 52.0 mA (radio
# 50.99), is 6.6 % above this curve's 47.8 at 14 dBm. Edit the table for
# another band, PA or board; measure more levels to replace the scaled ones.
# The stack asks for 20 dBm by default (wsbrd.conf tx_power): it is clamped
# to POUTMAX. HW5 ran at +10 dBm: `-o tx_power=10` to compare (§12).
tx_ma = 0:17.59 10:35.75 12:39.38 15.9:55.80
# Mode 3 [M3] at +10 dBm: 37.43 mA chip in TX (AEM fit over 20 windows, 8.12 +
# 29.31 × TX share) − 2.145; the 10 kHz traces give a plateau of 37.36 mA
# (10th–90th percentile 37.32–37.40, 422 frames). Within 1.3 % of mode 1a.
# Other levels [I]: the same datasheet curve scaled by 35.29 / 48.55 = 0.727.
tx_ma@3 = 0:17.36 10:35.29 12:38.88 15.9:55.09

[radio_transitions]
# <from>_<to> = <µs> <mA>, states off idle listen receive tx. Unlisted: free.
# RAIL's state timings (idle→RX, RX→TX, TX→RX) are not measured yet; none is
# charged. The emulated MAC already waits for them in its own timing, so these
# only move time between states, at the given current.
