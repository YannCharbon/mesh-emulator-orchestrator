# Power profile: EFR32FG25 SoC (MCU and radio on one chip), as our Wi-SUN
# firmware runs it today (nanostack-efr32fg25-freertos: SYSCLK from the 97.5 MHz
# RF PLL, a permanent EM1 requirement). Format: docs/POWER_MODEL.md §6.
#
# Units: currents in mA, times in µs, clock in MHz. Every figure says where it
# comes from:
#   [D Tx.y]  EFR32FG25 datasheet Rev. 1.2 (root repo
#             documents/pre-study/datasheets/efr32fg25-datasheet.pdf), table x.y
#   [V]       checked in our code (file or study named)
#   [I]       inference or estimate
#   HW5       to measure on the kits (BRD4001A AEM, cycle counter); replace the
#             value when HW5 has it
#
# Chip current = MCU state current + radio state current. The datasheet's
# radio figures are whole-chip currents "measured with MCU in EM1, HCLK =
# 39.0 MHz" (T4.8 header), so the radio currents below are those figures minus
# EM1 at 39 MHz: 26 µA/MHz × 39 MHz = 1.014 mA [D T4.5].
#   Caveats, for HW5: the MCU tables are at 3.6 V (DC-DC), the radio table at
#   3.3 V; T4.8's RX rows are marked EM1P1, and EM1P is 0.22 mA below EM1
#   (T4.8 note 1): read that way the RX adder would be 4.91 mA, not 4.69.

[profile]
name = efr32fg25-soc
kind = soc
supply_v = 3.3              # [D T4.8] VREGVDD = AVDD = PAVDD = 3.3 V, DC-DC

[mcu]
clock_mhz = 97.5            # [V] SYSCLK = RF PLL (idle-sleep study §4.1)
active_ma = 3.02            # [D T4.5] EM0, 31 µA/MHz × 97.5 MHz, Prime from flash (CoreMark: 43 µA/MHz = 4.19 mA). HW5
sleep_ma = 2.145            # [D T4.5] EM1, 22 µA/MHz × 97.5 MHz. HW5
deep_sleep_ma = 0.0046      # [D T4.5] EM2, full RAM retention, RTC on LFXO: 4.6 µA. HW5
sleep_enter_us = 1.13       # [D T4.11] entry to EM1, from flash
sleep_enter_ma = 3.02       # [I] EM0 current during the entry
sleep_wake_us = 0.03        # [D T4.11] wake from EM1: 3 HCLKs at 97.5 MHz
sleep_wake_ma = 3.02        # [I] EM0
deep_enter_us = 5.4         # [D T4.11] entry to EM2, from flash
deep_enter_ma = 3.02        # [I] EM0
deep_wake_us = 213.2        # [D T4.11 + T4.35] wake from EM2 from flash, 12.2 µs, then the HFXO start, 201 µs; PLL lock not in the datasheet. HW5
deep_wake_ma = 1.05         # [I] HFXO 0.479 mA [D T4.35] + EM0 on the 19 MHz HFRCO (30 µA/MHz [D T4.5] ≈ 0.57 mA). HW5

[cycles]
# Cost model: CPU cycles per kind of work in a wake, at mcu.clock_mhz. All are
# placeholders [I] until HW5 measures them with the cycle counter. They are
# set so that a tick wake (wake + tick ≈ 4500 cycles ≈ 46 µs) costs about
# 4 µA at 100 wakes/s, the idle-sleep study's estimate (§1, 4–6 µA).
wake = 3000                 # [I] interrupt, scheduler, run-loop iteration, sleep entry. HW5
tick = 1500                 # [I] system_timer_tick_update(). HW5
protocol = 6000             # [I] protocol timer: core timer of ~25 modules every 2nd call. HW5
mac = 2000                  # [I] MAC timers (ACK wait, CSMA, timed TX). HW5
fhss = 3000                 # [I] FHSS hop and broadcast schedule. HW5
radio = 1500                # [I] radio driver timers (RAIL events on the board). HW5
other = 2000                # [I] application and other timers. HW5
event = 4000                # [I] one event-loop event (tasklet handler). HW5
frame_in = 0                # [I] a frame on the medium that the radio did not take: no interrupt
rx_frame = 25000            # [I] a frame received: RX interrupt, MAC, CCM (hardware AES), 6LoWPAN. HW5
tx_frame = 15000            # [I] a frame sent: MAC, CCM, TX start and TX-done interrupt. HW5

[radio]
off_ma = 0                  # [I] radio powered down: nothing above the MCU state
idle_ma = 0                 # [I] RAIL idle: the HFXO is already in the MCU's EM1/EM0 figure. HW5
listen_ma = 4.686           # [D T4.8] IRX_LISTEN 868 MHz 2-GFSK 38.4 kbps 5.7 mA − 1.014 (the emulated PHY is 2-FSK 150 kbps: not in the table). HW5
receive_ma = 4.686          # [D T4.8] IRX_ACTIVE, same conditions, 5.7 mA − 1.014. HW5
cca_ma = 4.686              # [I] a CCA is RX
cca_us = 128                # [I] RAIL's default CCA duration for 802.15.4 (8 symbols at 62.5 ksym/s); the Wi-SUN PHY's value is HW5
idle_holds_clock = 1        # [I] RAIL time needs the HFXO unless RAIL_ConfigSleep() (study §4.2): an idle radio keeps light sleep
# TX at each power level, dBm:mA, linear in between and clamped outside.
# [D T4.8] 915 MHz CW, PAVDD = 3.3 V: 0 dBm 24.9 mA, 12 dBm 54.5 mA, POUTMAX
# (15.9 dBm typ. [D T4.14]) 76.8 mA; each − 1.014. At 868 MHz T4.8 gives one
# point: 14 dBm 52.0 mA (− 1.014 = 50.986). The stack asks for 20 dBm by
# default (wsbrd.conf tx_power): it is clamped to POUTMAX.
tx_ma = 0:23.886 12:53.486 15.9:75.786

[radio_transitions]
# <from>_<to> = <µs> <mA>, states off idle listen receive tx. Unlisted: free.
# RAIL's state timings (idle→RX, RX→TX, TX→RX) are HW5; none is charged yet.
# The emulated MAC already waits for them in its own timing, so these only
# move time between states, at the given current.
